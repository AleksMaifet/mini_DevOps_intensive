name: Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend_changed: ${{ steps.filter.outputs.frontend }}
      backend_changed: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Detect changed services
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'

  checks-frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend_changed == 'true'
    uses: ./.github/workflows/checks.yml
    with:
      context: frontend

  checks-backend:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend_changed == 'true'
    uses: ./.github/workflows/checks.yml
    with:
      context: backend

  build-frontend:
    needs: checks-frontend
    if: needs.detect-changes.outputs.frontend_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASS }}" | docker login -u ${{ secrets.DOCKER_USER }} --password-stdin

      - name: Build frontend image
        run: |
          docker build -t ${{ secrets.DOCKER_USER }}/devops-frontend:${{ github.sha }} ./frontend
          docker push ${{ secrets.DOCKER_USER }}/devops-frontend:${{ github.sha }}

  build-backend:
    needs: checks-backend
    if: needs.detect-changes.outputs.backend_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASS }}" | docker login -u ${{ secrets.DOCKER_USER }} --password-stdin

      - name: Build backend image
        run: |
          docker build -t ${{ secrets.DOCKER_USER }}/devops-backend:${{ github.sha }} ./backend
          docker push ${{ secrets.DOCKER_USER }}/devops-backend:${{ github.sha }}

