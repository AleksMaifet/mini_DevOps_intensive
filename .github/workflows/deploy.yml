name: Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  IMAGE_PREFIX: ${{ secrets.DOCKER_USER }}
  FRONT_IMAGE: devops-frontend
  BACK_IMAGE: devops-backend
  TAG: ${{ github.sha }}
  DOCKER_NETWORK: apps

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend_changed: ${{ steps.filter.outputs.frontend }}
      backend_changed: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Detect changed services
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'

  checks-frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend_changed == 'true'
    uses: ./.github/workflows/checks.yml
    with:
      context: frontend

  checks-backend:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend_changed == 'true'
    uses: ./.github/workflows/checks.yml
    with:
      context: backend

  build-frontend:
    needs: checks-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASS }}" | docker login -u ${{ secrets.DOCKER_USER }} --password-stdin

      - name: Build frontend image
        run: |
          docker build -t ${{ env.IMAGE_PREFIX }}/${{ env.FRONT_IMAGE }}:${{ env.TAG }} ./frontend
          docker push ${{ env.IMAGE_PREFIX }}/${{ env.FRONT_IMAGE }}:${{ env.TAG }}

  build-backend:
    needs: checks-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASS }}" | docker login -u ${{ secrets.DOCKER_USER }} --password-stdin

      - name: Build backend image
        run: |
          docker build -t ${{ env.IMAGE_PREFIX }}/${{ env.BACK_IMAGE }}:${{ env.TAG }} ./backend
          docker push ${{ env.IMAGE_PREFIX }}/${{ env.BACK_IMAGE }}:${{ env.TAG }}

  deploy-frontend:
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            echo ${{ secrets.DOCKER_PASS }} | docker login -u ${{ secrets.DOCKER_USER }} --password-stdin
            docker pull ${{ env.IMAGE_PREFIX }}/${{ env.FRONT_IMAGE }}:${{ env.TAG }}
            docker stop ${{ env.FRONT_IMAGE }} || true
            docker rm ${{ env.FRONT_IMAGE }} || true
            docker run -d --name ${{ env.FRONT_IMAGE }} --network ${{ env.DOCKER_NETWORK }} ${{ env.IMAGE_PREFIX }}/${{ env.FRONT_IMAGE }}:${{ env.TAG }}

  deploy-backend:
    needs: build-backend
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            echo ${{ secrets.DOCKER_PASS }} | docker login -u ${{ secrets.DOCKER_USER }} --password-stdin
            docker pull ${{ env.IMAGE_PREFIX }}/${{ env.BACK_IMAGE }}:${{ env.TAG }}
            docker stop ${{ env.BACK_IMAGE }} || true
            docker rm ${{ env.BACK_IMAGE }} || true
            docker run -d --name ${{ env.BACK_IMAGE }} --network ${{ env.DOCKER_NETWORK }} ${{ env.IMAGE_PREFIX }}/${{ env.BACK_IMAGE }}:${{ env.TAG }}